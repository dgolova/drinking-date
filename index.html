<style>
  :root{
    color-scheme: dark;
    --black: #08050a;
    --wine-deep: #1a0e14;
    --red: #c0303f;
    --red-bright: #e75a63;
    --red-hairline: rgba(231,90,99,0.42);
    --parchment: #e8ddd0;
    --muted: #93837c;
    --hairline: rgba(220,212,201,0.26);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{
    height:100%;
    background-color: var(--black);
    background-image: radial-gradient(120% 90% at 50% 0%, var(--wine-deep) 0%, var(--black) 62%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-size: clamp(17px, 4.9vw, 20px);
  }
  html,body{
    margin:0; padding:0;
    color: var(--parchment);
    font-family: 'EB Garamond', serif;
    overscroll-behavior:none;
  }
  body{
    background: transparent;
    min-height:100%;
    min-height:100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before{
    content:'';
    position: fixed;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, var(--wine-deep) 0%, var(--black) 62%);
    z-index: -1;
    pointer-events: none;
  }
  h1,h2,h3,.display{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .page{
    max-width: 480px;
    margin: 0 auto;
    padding: 34px 22px 40px;
    display:flex;
    flex-direction:column;
  }
  @media (max-width: 400px){
    .page{ padding: 26px 16px 34px; }
  }

  /* ---------- Section frame ---------- */
  .section{ padding: 22px 0 28px; }
  .section + .section{ border-top: 1px solid var(--hairline); }
  .section-title{
    font-size: 1.55rem;
    text-align: center;
    color: var(--parchment);
    margin-bottom: 18px;
  }

  /* ---------- Bottle spinner (fun only, no chrome around it) ---------- */
  .bottle-stage{
    display:flex;
    justify-content:center;
  }
  .bottle-pin{
    width: min(46vw, 190px);
    transform-origin: 50% 50%;
    transform: rotate(0deg);
    cursor:pointer;
  }
  .bottle-pin img{
    width:100%;
    height:auto;
    display:block;
    -webkit-user-drag: none;
    user-select:none;
    pointer-events:none;
  }

  .action-btn{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    color: var(--black);
    background: linear-gradient(180deg, var(--red-bright), var(--red));
    border: none;
    padding: 14px 32px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 6px 20px rgba(192,48,63,0.22);
  }
  .action-btn:active{ transform: translateY(1px); box-shadow: 0 3px 10px rgba(192,48,63,0.2); }
  .action-btn.secondary{
    background:none;
    color: var(--red-bright);
    border: 1px solid var(--red-hairline);
    box-shadow:none;
  }
  .btn-row{ display:flex; gap: 12px; justify-content:center; flex-wrap:wrap; margin-top: 20px; }

  /* ---------- Category picker ---------- */
  .cat-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .cat-card{
    background: linear-gradient(180deg, rgba(59,13,20,0.5), rgba(26,14,20,0.5));
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 16px 14px;
    text-align:left;
    color: var(--parchment);
    cursor:pointer;
    display:flex; flex-direction:column; gap: 6px;
  }
  .cat-card:active{ border-color: var(--red-hairline); background: rgba(231,90,99,0.08); }
  .cat-card .tag{ font-family:'Cormorant Garamond', serif; font-size: 1.15rem; }
  .cat-card .goal{ font-style: italic; color: var(--muted); font-size: 0.84rem; line-height:1.3; }

  /* ---------- Question card ---------- */
  @keyframes flipReveal{
    0%{ transform: rotateY(90deg) scale(0.92); opacity: 0.15; }
    55%{ transform: rotateY(0deg) scale(1.03); opacity: 1; }
    100%{ transform: rotateY(0deg) scale(1); opacity: 1; }
  }
  .flip-anim{
    animation: flipReveal 0.5s cubic-bezier(.25,.8,.35,1);
    animation-fill-mode: backwards;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  .result-card{
    width:100%;
    background: linear-gradient(180deg, rgba(59,13,20,0.55), rgba(26,14,20,0.55));
    border: 1px solid var(--red-hairline);
    border-radius: 18px;
    padding: 24px 22px 26px;
    text-align:center;
  }
  .result-tag{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--red-bright);
    margin-bottom: 12px;
  }
  .result-question{
    font-size: 1.32rem;
    line-height: 1.35;
    color: var(--gold-bright, #f2ece2);
  }

  .hidden{ display:none !important; }

  /* ---------- Tests (quiz) ---------- */
  .quiz-progress{
    text-align:center;
    color: var(--muted);
    font-style: italic;
    font-size: 0.92rem;
    margin-bottom: 16px;
  }
  .quiz-prompt{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.35rem;
    line-height:1.35;
    text-align:center;
    color: var(--parchment);
    margin-bottom: 20px;
  }
  .quiz-options{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .quiz-option{
    background: linear-gradient(180deg, rgba(59,13,20,0.5), rgba(26,14,20,0.5));
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 14px 16px;
    text-align:left;
    color: var(--parchment);
    font-family:'EB Garamond', serif;
    font-size: 1.02rem;
    line-height:1.35;
    cursor:pointer;
  }
  .quiz-option:active{ border-color: var(--red-hairline); background: rgba(231,90,99,0.1); }
  .quiz-result-name{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.5rem;
    color: var(--gold-bright, #f2ece2);
    margin-bottom: 6px;
  }
  .quiz-result-sub{
    font-style: italic;
    color: var(--red-bright);
    font-size: 0.98rem;
    margin-bottom: 14px;
  }
  .quiz-result-blurb{
    font-size: 1.05rem;
    line-height:1.45;
    color: var(--parchment);
  }
  .quiz-secondary{
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
    font-size: 0.95rem;
    color: var(--muted);
    line-height:1.4;
  }
  .quiz-secondary b{ color: var(--parchment); font-weight:600; }
  .quiz-disclaimer{
    text-align:center;
    color: var(--muted);
    font-style: italic;
    font-size: 0.85rem;
    margin-top: 16px;
  }

  /* ---------- Wound guide (reference table) ---------- */
  .test-row{ display:flex; align-items:stretch; gap: 10px; margin-bottom: 20px; }
  .test-row .cat-grid{ flex:1; margin-bottom:0; }
  .guide-btn{
    flex: 0 0 auto;
    align-self:center;
    font-family:'Cormorant Garamond', serif;
    font-size: 0.98rem;
    line-height: 1.15;
    letter-spacing: 0.02em;
    color: var(--red-bright);
    background:none;
    border: 1px solid var(--red-hairline);
    padding: 10px 16px;
    border-radius: 18px;
    cursor:pointer;
    text-align:center;
  }
  .guide-btn:active{ background: rgba(231,90,99,0.1); }
  .wound-guide-panel{
    margin-bottom: 22px;
    border: 1px solid var(--hairline);
    border-radius: 16px;
    overflow: hidden;
  }
  .wg-scroll{
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .wg-grid{
    display: grid;
    grid-template-columns: 130px 170px 150px 220px;
    min-width: 670px;
  }
  .wg-cell{
    padding: 12px 14px;
    font-size: 0.86rem;
    line-height: 1.4;
    border-bottom: 1px solid var(--hairline);
    border-right: 1px solid var(--hairline);
    background: rgba(26,14,20,0.35);
  }
  .wg-grid .wg-cell:nth-child(4n){ border-right:none; }
  .wg-cell.wg-alt{ background: rgba(59,13,20,0.4); }
  .wg-cell.wg-head{
    background: var(--wine-deep);
    font-family:'Cormorant Garamond', serif;
    font-size: 0.95rem;
    color: var(--gold-bright, #f2ece2);
    letter-spacing: 0.01em;
  }
  .wg-cell.wg-sticky{
    position: sticky;
    left: 0;
    font-family:'Cormorant Garamond', serif;
    font-size: 1rem;
    color: var(--gold-bright, #f2ece2);
    background: #1f1015;
  }
  .wg-cell.wg-sticky.wg-alt{ background: #2a1219; }
  .wg-cell .wg-belief-text{ color: var(--red-bright); font-style: italic; }
</style>
</head>

  // ---------- spinner (purely for fun, no category link) ----------
  var bottle = document.getElementById('bottlePin');
  var currentRotation = 0;
  var spinning = false;

  function spinBottle(){
    if (spinning) return;
    spinning = true;

    var randomAngle = Math.random() * 360;
    var extraSpins = 4 + Math.floor(Math.random() * 3);
    var baseline = Math.ceil((currentRotation + 1) / 360) * 360;
    var finalRotation = baseline + extraSpins * 360 + randomAngle;
    currentRotation = finalRotation;

    bottle.style.transition = 'transform 3.1s cubic-bezier(0.14,0.82,0.24,1)';
    bottle.style.transform = 'rotate(' + finalRotation + 'deg)';

    setTimeout(function(){
      spinning = false;
    }, 3150);
  }
  bottle.addEventListener('click', spinBottle);

  // ---------- category picker + card draw (reusable for any section) ----------
  function setupQuestionSection(gridId, cardViewId, resultSlotId, drawAgainId, changeCatId, categories){
    var grid = document.getElementById(gridId);
    var cardView = document.getElementById(cardViewId);
    var resultSlot = document.getElementById(resultSlotId);
    var drawAgainBtn = document.getElementById(drawAgainId);
    var changeCatBtn = document.getElementById(changeCatId);
    var activeCategory = null;
    var lastIdxByCategory = {};

    categories.forEach(function(cat, i){
      var btn = document.createElement('button');
      btn.className = 'cat-card';
      btn.innerHTML = '<span class="tag">' + cat.tagline + '</span><span class="goal">' + cat.goal + '</span>';
      btn.addEventListener('click', function(){
        activeCategory = i;
        grid.classList.add('hidden');
        cardView.classList.remove('hidden');
        drawQuestion();
      });
      grid.appendChild(btn);
    });

    function drawQuestion(){
      var cat = categories[activeCategory];
      var pool = cat.questions;
      var idx;
      if (pool.length > 1 && lastIdxByCategory[activeCategory] !== undefined){
        do { idx = Math.floor(Math.random() * pool.length); }
        while (idx === lastIdxByCategory[activeCategory]);
      } else {
        idx = Math.floor(Math.random() * pool.length);
      }
      lastIdxByCategory[activeCategory] = idx;

      resultSlot.innerHTML =
        '<div class="result-card flip-anim">' +
          '<div class="result-tag">' + cat.tagline + '</div>' +
          '<div class="result-question">' + pool[idx] + '</div>' +
        '</div>';
    }

    drawAgainBtn.addEventListener('click', drawQuestion);
    changeCatBtn.addEventListener('click', function(){
      cardView.classList.add('hidden');
      grid.classList.remove('hidden');
    });
  }

  setupQuestionSection('catGrid', 'cardView', 'resultSlot', 'drawAnotherBtn', 'changeCatBtn', CATEGORIES);
  setupQuestionSection('bachCatGrid', 'bachCardView', 'bachResultSlot', 'bachDrawAnotherBtn', 'bachChangeCatBtn', CATEGORIES_BACH);

  // ---------- Tests: quiz engine ----------
  (function setupTests(){
    var WOUND_GUIDE = [
      { type: 'Empath, caregiver, rescuer', belief: '\u201cI\u2019m valued only if I\u2019m useful.\u201d', wound: 'Feeling unneeded / emotional neglect', trigger: 'Not expressing gratitude, not needing their help, excluding them from important matters, showing that everything works fine without them.' },
      { type: 'Controller, organizer', belief: '\u201cIf I\u2019m not in control, something bad will happen.\u201d', wound: 'Anxiety, fear of losing control', trigger: 'Being unpredictable, changing plans at the last minute, withholding information, breaking agreements, creating chaos.' },
      { type: 'Highly independent person', belief: '\u201cIt\u2019s better to keep my distance than to be hurt again.\u201d', wound: 'Rejection', trigger: 'Pushing them away, criticizing who they are, rejecting attempts to get closer, showing a lack of acceptance.' },
      { type: 'Anxiously attached, highly romantic', belief: '\u201cPeople I love will eventually leave me.\u201d', wound: 'Abandonment', trigger: 'Taking a long time to reply, becoming emotionally distant, canceling plans, saying \u201cI need space.\u201d' },
      { type: 'Perfectionist', belief: '\u201cI have to be perfect.\u201d', wound: 'Shame, injustice', trigger: 'Criticizing mistakes, comparing them to others, pointing out flaws, dismissing or minimizing their achievements.' },
      { type: 'People-pleaser', belief: '\u201cI\u2019m responsible for other people\u2019s feelings.\u201d', wound: 'Guilt', trigger: 'Saying \u201cYou upset me,\u201d expressing deep disappointment, blaming them, making them feel they\u2019ve let you down.' },
      { type: 'Jealous, suspicious person', belief: '\u201cPeople can\u2019t be trusted.\u201d', wound: 'Betrayal', trigger: 'Lying, hiding information, breaking promises, flirting with others, being secretive.' },
      { type: 'Justice seeker', belief: '\u201cEverything should be fair.\u201d', wound: 'Injustice', trigger: 'Double standards, baseless accusations, favoritism, unfair decisions.' },
      { type: 'Conflict avoidant', belief: '\u201cIf I show my true self, I\u2019ll be rejected.\u201d', wound: 'Rejection', trigger: 'Harsh criticism, ridicule, public humiliation, dismissing or invalidating their feelings.' },
      { type: 'Confident leader', belief: '\u201cI can handle this.\u201d', wound: 'May not have a dominant core wound', trigger: 'Usually doesn\u2019t have one specific trigger; reactions depend more on personality, values, and life experiences than on a single underlying wound.' }
    ];

    var woundGuideBtn = document.getElementById('woundGuideBtn');
    var woundGuidePanel = document.getElementById('woundGuidePanel');
    var guideBuilt = false;

    woundGuideBtn.addEventListener('click', function(){
      if (!guideBuilt){
        var headers = ['Personality type', 'Core belief', 'Likely underlying wound', 'What typically triggers the wound'];
        var html = '<div class="wg-scroll"><div class="wg-grid">';
        headers.forEach(function(h){
          html += '<div class="wg-cell wg-head' + (h === 'Personality type' ? ' wg-sticky' : '') + '">' + h + '</div>';
        });
        WOUND_GUIDE.forEach(function(row, i){
          var alt = (i % 2 === 1) ? ' wg-alt' : '';
          html += '<div class="wg-cell' + alt + ' wg-sticky">' + row.type + '</div>';
          html += '<div class="wg-cell' + alt + '"><span class="wg-belief-text">' + row.belief + '</span></div>';
          html += '<div class="wg-cell' + alt + '">' + row.wound + '</div>';
          html += '<div class="wg-cell' + alt + '">' + row.trigger + '</div>';
        });
        html += '</div></div>';
        woundGuidePanel.innerHTML = html;
        guideBuilt = true;
      }
      var isHidden = woundGuidePanel.classList.contains('hidden');
      woundGuidePanel.classList.toggle('hidden');
      woundGuideBtn.innerHTML = isHidden ? 'Hide<br>Trauma<br>Guide' : 'Trauma<br>Guide';
    });

    var TESTS = [
      {
        key: 'corewound',
        tagline: 'Which Pattern Shows Up for You',
        goal: 'A 10-question reflection on the patterns behind how you react.',
        questions: QUIZ_QUESTIONS
      }
    ];

    var testGrid = document.getElementById('testGrid');
    var quizView = document.getElementById('quizView');
    var quizResultView = document.getElementById('quizResultView');
    var quizProgress = document.getElementById('quizProgress');
    var quizPrompt = document.getElementById('quizPrompt');
    var quizOptions = document.getElementById('quizOptions');
    var quizResultCard = document.getElementById('quizResultCard');
    var quizRetakeBtn = document.getElementById('quizRetakeBtn');
    var quizBackBtn = document.getElementById('quizBackBtn');

    var activeTest = null;
    var qIndex = 0;
    var scores = {};

    TESTS.forEach(function(test, i){
      var btn = document.createElement('button');
      btn.className = 'cat-card';
      btn.innerHTML = '<span class="tag">' + test.tagline + '</span><span class="goal">' + test.goal + '</span>';
      btn.addEventListener('click', function(){
        activeTest = test;
        startQuiz();
      });
      testGrid.appendChild(btn);
    });

    function startQuiz(){
      qIndex = 0;
      scores = {};
      testGrid.classList.add('hidden');
      quizResultView.classList.add('hidden');
      quizView.classList.remove('hidden');
      renderQuestion();
    }

    function renderQuestion(){
      var total = activeTest.questions.length;
      var q = activeTest.questions[qIndex];
      quizProgress.textContent = 'Question ' + (qIndex + 1) + ' of ' + total;
      quizPrompt.textContent = q.prompt;
      quizOptions.innerHTML = '';
      q.options.forEach(function(opt){
        var b = document.createElement('button');
        b.className = 'quiz-option';
        b.textContent = opt.text;
        b.addEventListener('click', function(){
          scores[opt.w] = (scores[opt.w] || 0) + 1;
          qIndex++;
          if (qIndex < total){
            renderQuestion();
          } else {
            showResult();
          }
        });
        quizOptions.appendChild(b);
      });
    }

    function showResult(){
      // max possible score per wound = how many questions offer that wound as an option
      var maxByWound = {};
      activeTest.questions.forEach(function(q){
        q.options.forEach(function(opt){
          maxByWound[opt.w] = (maxByWound[opt.w] || 0) + 1;
        });
      });

      var woundIds = Object.keys(maxByWound).filter(function(id){ return id !== 'W0'; });
      var intensities = woundIds.map(function(id){
        var raw = scores[id] || 0;
        var max = maxByWound[id] || 1;
        return { id: id, pct: Math.round((raw / max) * 100) };
      }).sort(function(a, b){ return b.pct - a.pct; });

      var top = intensities[0];
      var second = intensities[1];
      var allLow = intensities.every(function(x){ return x.pct < 30; });

      quizView.classList.add('hidden');
      quizResultView.classList.remove('hidden');

      var html = '';
      if (allLow || !top || top.pct === 0){
        var conf = WOUND_INFO.W0;
        html += '<div class="quiz-result-name">' + conf.name + '</div>';
        html += '<div class="quiz-result-sub">Low Vulnerability &middot; Dominant Resilience</div>';
        html += '<div class="quiz-result-blurb">' + conf.blurb + '</div>';
      } else {
        var primary = WOUND_INFO[top.id];
        html += '<div class="quiz-result-name">' + primary.name + '</div>';
        html += '<div class="quiz-result-sub">' + primary.short + ' &middot; ' + top.pct + '%</div>';
        html += '<div class="quiz-result-blurb">' + primary.blurb + '</div>';

        if (second && second.pct >= 50){
          var sec = WOUND_INFO[second.id];
          html += '<div class="quiz-secondary">Also showing up: <b>' + sec.name + '</b> (' + sec.short + ', ' + second.pct + '%) — ' + sec.blurb + '</div>';
        }
      }
      quizResultCard.innerHTML = html;
      quizResultCard.classList.remove('flip-anim');
      void quizResultCard.offsetWidth;
      quizResultCard.classList.add('flip-anim');
    }

    quizRetakeBtn.addEventListener('click', startQuiz);
    quizBackBtn.addEventListener('click', function(){
      quizResultView.classList.add('hidden');
      testGrid.classList.remove('hidden');
    });
  })();

})();

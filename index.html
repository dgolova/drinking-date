<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dahlia's Destiny</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dahlia's Destiny">
<meta name="theme-color" content="#08050a">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --black: #08050a;
    --wine-deep: #1a0e14;
    --red: #c0303f;
    --red-bright: #e75a63;
    --red-hairline: rgba(231,90,99,0.42);
    --parchment: #e8ddd0;
    --muted: #93837c;
    --hairline: rgba(220,212,201,0.26);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{
    height:100%;
    background-color: var(--black);
    background-image: radial-gradient(120% 90% at 50% 0%, var(--wine-deep) 0%, var(--black) 62%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-size: clamp(17px, 4.9vw, 20px);
  }
  html,body{
    margin:0; padding:0;
    color: var(--parchment);
    font-family: 'EB Garamond', serif;
    overscroll-behavior:none;
  }
  body{
    background: transparent;
    min-height:100%;
    min-height:100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before{
    content:'';
    position: fixed;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, var(--wine-deep) 0%, var(--black) 62%);
    z-index: -1;
    pointer-events: none;
  }
  h1,h2,h3,.display{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .page{
    max-width: 480px;
    margin: 0 auto;
    padding: 34px 22px 40px;
    display:flex;
    flex-direction:column;
  }
  @media (max-width: 400px){
    .page{ padding: 26px 16px 34px; }
  }

  /* ---------- Section frame ---------- */
  .section{ padding: 22px 0 28px; }
  .section + .section{ border-top: 1px solid var(--hairline); }

  /* ---------- Bottle spinner (fun only, no chrome around it) ---------- */
  .bottle-stage{
    display:flex;
    justify-content:center;
  }
  .bottle-pin{
    width: min(46vw, 190px);
    transform-origin: 50% 50%;
    transform: rotate(0deg);
    cursor:pointer;
  }
  .bottle-pin img{
    width:100%;
    height:auto;
    display:block;
    -webkit-user-drag: none;
    user-select:none;
    pointer-events:none;
  }

  .action-btn{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    color: var(--black);
    background: linear-gradient(180deg, var(--red-bright), var(--red));
    border: none;
    padding: 14px 32px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 6px 20px rgba(192,48,63,0.22);
  }
  .action-btn:active{ transform: translateY(1px); box-shadow: 0 3px 10px rgba(192,48,63,0.2); }
  .action-btn.secondary{
    background:none;
    color: var(--red-bright);
    border: 1px solid var(--red-hairline);
    box-shadow:none;
  }
  .btn-row{ display:flex; gap: 12px; justify-content:center; flex-wrap:wrap; margin-top: 20px; }

  /* ---------- Category picker ---------- */
  .cat-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .cat-card{
    background: linear-gradient(180deg, rgba(59,13,20,0.5), rgba(26,14,20,0.5));
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 16px 14px;
    text-align:left;
    color: var(--parchment);
    cursor:pointer;
    display:flex; flex-direction:column; gap: 6px;
  }
  .cat-card:active{ border-color: var(--red-hairline); background: rgba(231,90,99,0.08); }
  .cat-card .tag{ font-family:'Cormorant Garamond', serif; font-size: 1.15rem; }
  .cat-card .goal{ font-style: italic; color: var(--muted); font-size: 0.84rem; line-height:1.3; }

  /* ---------- Question card ---------- */
  @keyframes flipReveal{
    0%{ transform: rotateY(90deg) scale(0.92); opacity: 0.15; }
    55%{ transform: rotateY(0deg) scale(1.03); opacity: 1; }
    100%{ transform: rotateY(0deg) scale(1); opacity: 1; }
  }
  .flip-anim{
    animation: flipReveal 0.5s cubic-bezier(.25,.8,.35,1);
    animation-fill-mode: backwards;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  .result-card{
    width:100%;
    background: linear-gradient(180deg, rgba(59,13,20,0.55), rgba(26,14,20,0.55));
    border: 1px solid var(--red-hairline);
    border-radius: 18px;
    padding: 24px 22px 26px;
    text-align:center;
  }
  .result-tag{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--red-bright);
    margin-bottom: 12px;
  }
  .result-question{
    font-size: 1.32rem;
    line-height: 1.35;
    color: var(--gold-bright, #f2ece2);
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="page">

  <!-- ============ SPIN (just for fun) ============ -->
  <section class="section">
    <div class="bottle-stage">
      <div class="bottle-pin" id="bottlePin">
        <img src="assets/bottle.jpg" alt="Spin the bottle">
      </div>
    </div>
  </section>

  <!-- ============ DRAW A QUESTION ============ -->
  <section class="section">
    <div class="cat-grid" id="catGrid"></div>

    <div id="cardView" class="hidden">
      <div id="resultSlot"></div>
      <div class="btn-row">
        <button class="action-btn" id="drawAnotherBtn">Draw Another</button>
        <button class="action-btn secondary" id="changeCatBtn">Change Category</button>
      </div>
    </div>
  </section>

</div>

<script>
(function(){

  // ---------- data ----------
  var CATEGORIES = [
    {
      key: 'values',
      name: 'Values & Life Trajectory',
      tagline: 'The Foundation',
      goal: 'Worldviews, non-negotiables, and long-term paths.',
      questions: [
        'What does a balanced life look like to you in 5 years?',
        'How was conflict handled in your house growing up?',
        'Are you a saver, an investor, or an experience-spender?',
        'What role does faith or spirituality play in your life, if any?',
        'Where do you see yourself living in ten years — same city, different country?',
        'How important is having kids to you, and by when would you want to know?',
        'What is a career sacrifice you would never make for a relationship?',
        'How do you define success for yourself?',
        'What did your parents get right, and what would you do differently?',
        'How much does your work identity define who you are?',
        'What is a value you will not compromise on for anyone?',
        'If money were not a factor, how would you spend your time?'
      ]
    },
    {
      key: 'mirror',
      name: 'Emotional Intelligence & Self-Awareness',
      tagline: 'The Mirror',
      goal: 'How they process feelings, mistakes, and their own past.',
      questions: [
        'What is a mistake you have made in a past relationship that taught you something important?',
        'How do you usually express stress or overwhelm, and what do you need from a partner when you feel that way?',
        'What is something you are actively working on improving about yourself?',
        'When was the last time you cried, and what brought it on?',
        'What is a pattern from your past relationships you are trying to break?',
        'How do you know when you are wrong, and how easily can you admit it?',
        'What is something people misunderstand about you at first?',
        'How do you handle being told something you do not want to hear?',
        'What is a fear you have had to work through recently?',
        'Who do you go to when you need to process something hard, and why them?',
        'What does self-care actually look like for you, beyond the buzzword?',
        'How has reflection or therapy shaped how you show up in relationships?'
      ]
    },
    {
      key: 'connect',
      name: 'Love Languages & Daily Intimacy',
      tagline: 'The Connection',
      goal: 'How they feel loved, give love, and stay close day to day.',
      questions: [
        'When do you feel most appreciated or cared for by someone you are dating?',
        'What does your ideal downtime look like after a hard week?',
        'How much alone time do you typically need to recharge?',
        'What is a small gesture that makes you feel loved?',
        'Do you prefer to be physically affectionate in public, or keep it private?',
        'How do you like to be comforted when you are having a rough day?',
        'What does quality time look like to you on an ordinary Tuesday?',
        'How do you feel about surprises — plan everything, or love the unexpected?',
        'What is something a partner did for you that you still think about?',
        'How important is physical touch to you day-to-day, outside the bedroom?',
        'What makes you feel unseen in a relationship?',
        'Do you show love more through words, actions, or gifts?'
      ]
    },
    {
      key: 'storm',
      name: 'Conflict & Communication Style',
      tagline: 'The Storm Prep',
      goal: 'How they handle disagreements, criticism, and boundaries.',
      questions: [
        'When you get upset with someone, do you need space right away, or do you prefer to talk it out immediately?',
        'What is a major dealbreaker for you in communication?',
        'How do you feel about raised voices during an argument?',
        'What is the difference between a disagreement and a dealbreaker for you?',
        'How do you bring up something that has been bothering you?',
        'What is your instinct when you feel criticized — defend, shut down, or ask questions?',
        'How do you rebuild trust after it has been broken?',
        'Do you keep score in relationships, or let things go once they are resolved?',
        'What does an apology need to include for you to actually accept it?',
        'How do you set a boundary without feeling guilty?',
        'What is a conversation you have been avoiding having with someone?',
        'How soon after a fight do you expect to reconnect?'
      ]
    }
  ];

  // ---------- spinner (purely for fun, no category link) ----------
  var bottle = document.getElementById('bottlePin');
  var currentRotation = 0;
  var spinning = false;

  function spinBottle(){
    if (spinning) return;
    spinning = true;

    var randomAngle = Math.random() * 360;
    var extraSpins = 4 + Math.floor(Math.random() * 3);
    var baseline = Math.ceil((currentRotation + 1) / 360) * 360;
    var finalRotation = baseline + extraSpins * 360 + randomAngle;
    currentRotation = finalRotation;

    bottle.style.transition = 'transform 3.1s cubic-bezier(0.14,0.82,0.24,1)';
    bottle.style.transform = 'rotate(' + finalRotation + 'deg)';

    setTimeout(function(){
      spinning = false;
    }, 3150);
  }
  bottle.addEventListener('click', spinBottle);

  // ---------- category picker + card draw ----------
  var catGrid = document.getElementById('catGrid');
  var cardView = document.getElementById('cardView');
  var resultSlot = document.getElementById('resultSlot');
  var drawAnotherBtn = document.getElementById('drawAnotherBtn');
  var changeCatBtn = document.getElementById('changeCatBtn');
  var activeCategory = null;
  var lastIdxByCategory = {};

  CATEGORIES.forEach(function(cat, i){
    var btn = document.createElement('button');
    btn.className = 'cat-card';
    btn.innerHTML = '<span class="tag">' + cat.tagline + '</span><span class="goal">' + cat.goal + '</span>';
    btn.addEventListener('click', function(){
      activeCategory = i;
      catGrid.classList.add('hidden');
      cardView.classList.remove('hidden');
      drawQuestion();
    });
    catGrid.appendChild(btn);
  });

  function drawQuestion(){
    var cat = CATEGORIES[activeCategory];
    var pool = cat.questions;
    var idx;
    if (pool.length > 1 && lastIdxByCategory[activeCategory] !== undefined){
      do { idx = Math.floor(Math.random() * pool.length); }
      while (idx === lastIdxByCategory[activeCategory]);
    } else {
      idx = Math.floor(Math.random() * pool.length);
    }
    lastIdxByCategory[activeCategory] = idx;

    resultSlot.innerHTML =
      '<div class="result-card flip-anim">' +
        '<div class="result-tag">' + cat.tagline + '</div>' +
        '<div class="result-question">' + pool[idx] + '</div>' +
      '</div>';
  }

  drawAnotherBtn.addEventListener('click', drawQuestion);
  changeCatBtn.addEventListener('click', function(){
    cardView.classList.add('hidden');
    catGrid.classList.remove('hidden');
  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Drinking Date</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drinking Data">
<meta name="theme-color" content="#08050a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --black: #08050a;
    --wine-deep: #1a0e14;
    --burgundy: #3b0d14;
    --wine: #6e0f1f;
    --wine-bright: #9c2c3a;
    --gold: #b6ada0;
    --gold-bright: #f2ece2;
    --red: #c0303f;
    --red-bright: #e75a63;
    --red-hairline: rgba(231,90,99,0.42);
    --parchment: #e8ddd0;
    --muted: #93837c;
    --hairline: rgba(220,212,201,0.26);
    --petal-outer: #f0e2ce;
    --petal-mid: #c05468;
    --petal-inner: #7d1226;
    /* the four wheel wedges — one family, four depths */
    --q-values: #6e0f1f;
    --q-mirror: #7d1226;
    --q-connect: #9c2c3a;
    --q-storm: #3b0d14;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{
    height:100%;
    background-color: var(--black);
    background-image: radial-gradient(120% 90% at 50% 0%, var(--wine-deep) 0%, var(--black) 62%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-size: clamp(17px, 4.9vw, 20px);
  }
  html,body{
    margin:0; padding:0;
    color: var(--parchment);
    font-family: 'EB Garamond', serif;
    overscroll-behavior:none;
  }
  body{
    background: transparent;
    min-height:100%;
    min-height:100dvh;
    display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before{
    content:'';
    position: fixed;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, var(--wine-deep) 0%, var(--black) 62%);
    z-index: -1;
    pointer-events: none;
  }
  h1,h2,h3,.display{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .screen{
    display:none;
    flex:1;
    flex-direction:column;
    padding: 28px 22px 36px;
    max-width: 520px;
    margin: 0 auto;
    width:100%;
    animation: rise 0.35s ease;
  }
  .screen.active{ display:flex; }
  @media (max-width: 400px){
    .screen{ padding: 24px 16px 32px; }
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Home ---------- */
  #home .home-top{
    text-align:center;
    padding-top: 18px;
    margin-bottom: 34px;
  }
  .dahlia-mark{
    width:84px; height:84px;
    margin: 0 auto 14px;
    display:block;
  }
  .app-title{ font-size: 2.3rem; color: var(--parchment); }
  .app-sub{
    font-style: italic;
    color: var(--muted);
    font-size: 1.05rem;
    margin-top: 6px;
  }
  .menu{
    border-top: 1px solid var(--hairline);
  }
  .menu-item{
    width:100%;
    background:none; border:none;
    border-bottom: 1px solid var(--hairline);
    color: var(--parchment);
    font-family:'Cormorant Garamond', serif;
    text-align:left;
    padding: 20px 4px;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }
  .menu-item .label{ display:flex; flex-direction:column; gap:3px; }
  .menu-item .name{ font-size: 1.45rem; }
  .menu-item .hint{ font-family:'EB Garamond', serif; font-style:italic; font-size:0.95rem; color: var(--muted); }
  .menu-item .chevron{ color: var(--red-bright); font-size:1.4rem; opacity:0.85; }
  .menu-item:active{ background: rgba(231,90,99,0.07); }
  .footer-note{
    text-align:center;
    color: var(--muted);
    font-style: italic;
    font-size: 0.95rem;
    margin-top: 30px;
  }

  /* ---------- Shared sub-view header ---------- */
  .subhead{
    display:flex; align-items:center; gap:14px;
    margin-bottom: 22px;
  }
  .back-btn{
    background:none; border: 1px solid var(--red-hairline);
    color: var(--red-bright);
    font-family:'Cormorant Garamond', serif;
    font-size: 1.05rem;
    padding: 7px 15px;
    border-radius: 999px;
    cursor:pointer;
  }
  .back-btn:active{ background: rgba(231,90,99,0.12); }
  .subhead h2{ font-size: 1.6rem; }

  .stage{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center;
    justify-content:center;
    justify-content: safe center;
    gap: 26px;
    text-align:center;
    perspective: 900px;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .stage > *{ flex-shrink: 0; }
  .actions{
    flex: 0 0 auto;
    display:flex; gap: 12px; flex-wrap:wrap; justify-content:center;
    padding-top: 20px;
  }
  .prompt{ color: var(--muted); font-style: italic; font-size: 1.12rem; max-width: 340px; }

  @keyframes flipReveal{
    0%{ transform: rotateY(90deg) scale(0.92); opacity: 0.15; }
    55%{ transform: rotateY(0deg) scale(1.03); opacity: 1; }
    100%{ transform: rotateY(0deg) scale(1); opacity: 1; }
  }
  .flip-anim{
    animation: flipReveal 0.5s cubic-bezier(.25,.8,.35,1);
    animation-fill-mode: backwards;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  .result-slot{
    min-height: 90px;
    width: 100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 14px;
  }
  .card-icon{ width:44px; height:44px; display:block; margin: 0 auto; }

  .action-btn{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
    color: var(--black);
    background: linear-gradient(180deg, var(--red-bright), var(--red));
    border: none;
    padding: 15px 34px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 6px 20px rgba(192,48,63,0.22);
  }
  .action-btn:active{ transform: translateY(1px); box-shadow: 0 3px 10px rgba(192,48,63,0.2); }
  .action-btn.secondary{
    background:none;
    color: var(--red-bright);
    border: 1px solid var(--red-hairline);
    box-shadow:none;
  }
  .action-btn:disabled{ opacity:0.45; pointer-events:none; }

  /* ---------- Wheel (game) ---------- */
  .wheel-wrap{
    position:relative;
    width: min(72vw, 280px);
    aspect-ratio: 1/1;
    margin: 0 auto;
  }
  .wheel{
    position:absolute; inset:0;
    border-radius:50%;
    background: conic-gradient(
      var(--q-values) 0deg 90deg,
      var(--q-mirror) 90deg 180deg,
      var(--q-connect) 180deg 270deg,
      var(--q-storm) 270deg 360deg
    );
    border: 1px solid var(--hairline);
    box-shadow: 0 0 0 6px rgba(8,5,10,0.6), 0 18px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.35);
  }
  .wheel::after{
    content:'';
    position:absolute; inset: 22%;
    border-radius:50%;
    background: radial-gradient(circle at 50% 40%, var(--wine-deep), var(--black) 75%);
    border: 1px solid var(--hairline);
  }
  .wedge-label{
    position:absolute;
    width: 42%;
    transform: translate(-50%, -50%);
    font-family:'Cormorant Garamond', serif;
    font-size: 0.92rem;
    letter-spacing:0.03em;
    color: var(--parchment);
    opacity:0.88;
    line-height:1.15;
    pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .wedge-label.lit{ opacity:1; transform: translate(-50%,-50%) scale(1.08); color: var(--gold-bright); }
  .wl-0{ top: 17%; left: 50%; }
  .wl-1{ top: 50%; left: 83%; }
  .wl-2{ top: 83%; left: 50%; }
  .wl-3{ top: 50%; left: 17%; }

  .bottle-pin{
    position:absolute;
    top:50%; left:50%;
    width: 20%;
    height: 62%;
    transform-origin: 50% 50%;
    transform: translate(-50%,-50%) rotate(0deg);
    cursor:pointer;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.55));
  }
  .bottle-pin.spinning{ cursor:default; }
  .bottle-pin svg{ width:100%; height:100%; display:block; overflow:visible; }

  .result-card{
    width:100%;
    max-width: 380px;
    background: linear-gradient(180deg, rgba(59,13,20,0.55), rgba(26,14,20,0.55));
    border: 1px solid var(--red-hairline);
    border-radius: 18px;
    padding: 22px 22px 24px;
  }
  .result-tag{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--red-bright);
    margin-bottom: 10px;
  }
  .result-question{
    font-size: 1.28rem;
    line-height: 1.35;
    color: var(--gold-bright);
  }

  /* ---------- Browse ---------- */
  .accordion{ width:100%; }
  .acc-item{
    border-bottom: 1px solid var(--hairline);
  }
  .acc-head{
    width:100%;
    background:none; border:none;
    display:flex; align-items:center; justify-content:space-between; gap: 14px;
    padding: 18px 2px;
    cursor:pointer;
    text-align:left;
    color: var(--parchment);
  }
  .acc-head .t{ display:flex; flex-direction:column; gap:4px; }
  .acc-head .name{ font-family:'Cormorant Garamond', serif; font-size:1.3rem; }
  .acc-head .goal{ font-family:'EB Garamond', serif; font-style:italic; font-size:0.92rem; color: var(--muted); }
  .acc-head .swatch{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .acc-chevron{ color: var(--red-bright); transition: transform 0.25s ease; flex:0 0 auto; }
  .acc-item.open .acc-chevron{ transform: rotate(90deg); }
  .acc-body{
    max-height:0;
    overflow:hidden;
    transition: max-height 0.3s ease;
  }
  .acc-item.open .acc-body{ max-height: 1400px; }
  .acc-list{
    list-style:none;
    margin:0; padding: 2px 2px 18px;
    display:flex; flex-direction:column; gap: 13px;
  }
  .acc-list li{
    font-size: 1.03rem;
    line-height:1.4;
    color: var(--parchment);
    padding-left: 16px;
    position:relative;
  }
  .acc-list li::before{
    content:'';
    position:absolute; left:0; top:0.55em;
    width:6px; height:6px; border-radius:50%;
    background: var(--red-bright);
  }
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen active">
  <div class="home-top">
    <svg class="dahlia-mark" viewBox="0 0 100 100">
      <g>
        <circle cx="50" cy="50" r="10" fill="var(--gold-bright)"/>
        <g id="petals-home"></g>
      </g>
    </svg>
    <h1 class="app-title">Drinking Date</h1>
    <p class="app-sub">A slow spin through what matters</p>
  </div>

  <div class="menu">
    <button class="menu-item" data-goto="game">
      <span class="label">
        <span class="name">Spin the Bottle</span>
        <span class="hint">Let it choose your next question</span>
      </span>
      <span class="chevron">›</span>
    </button>
    <button class="menu-item" data-goto="browse">
      <span class="label">
        <span class="name">All Questions</span>
        <span class="hint">Read through every section at your own pace</span>
      </span>
      <span class="chevron">›</span>
    </button>
  </div>

  <p class="footer-note">Pour something you like. Ask slowly.</p>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen">
  <div class="subhead">
    <button class="back-btn" data-goto="home">‹ Back</button>
    <h2>Spin the Bottle</h2>
  </div>

  <div class="stage">
    <div class="wheel-wrap">
      <div class="wheel">
        <div class="wedge-label wl-0" data-idx="0">Foundation</div>
        <div class="wedge-label wl-1" data-idx="1">Mirror</div>
        <div class="wedge-label wl-2" data-idx="2">Storm Prep</div>
        <div class="wedge-label wl-3" data-idx="3">Connection</div>
      </div>
      <div class="bottle-pin" id="bottlePin">
        <svg viewBox="0 0 80 220" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#c0303f"/>
              <stop offset="50%" stop-color="#e75a63"/>
              <stop offset="100%" stop-color="#8c1f2c"/>
            </linearGradient>
          </defs>
          <rect x="31" y="2" width="18" height="16" rx="3" fill="#2a1116" stroke="#4a1e26"/>
          <rect x="34" y="17" width="12" height="28" fill="url(#glassGrad)" opacity="0.9"/>
          <path d="M34,45 L15,68 L15,203 Q15,213 25,213 L55,213 Q65,213 65,203 L65,68 L46,45 Z" fill="url(#glassGrad)" opacity="0.92"/>
          <rect x="21" y="108" width="38" height="52" rx="3" fill="#f2ece2" opacity="0.94"/>
          <text x="40" y="130" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="10" letter-spacing="1" fill="#3b0d14">RESERVE</text>
          <text x="40" y="148" text-anchor="middle" font-family="Cormorant Garamond, serif" font-weight="600" font-size="13" letter-spacing="1.5" fill="#6e0f1f">VODKA</text>
          <line x1="40" y1="153" x2="40" y2="156" stroke="#6e0f1f" stroke-width="1"/>
        </svg>
      </div>
    </div>

    <p class="prompt" id="gamePrompt">Tap the bottle to spin.</p>

    <div class="result-slot" id="resultSlot"></div>
  </div>

  <div class="actions">
    <button class="action-btn" id="spinBtn">Spin</button>
  </div>
</section>

<!-- ============ BROWSE ============ -->
<section id="browse" class="screen">
  <div class="subhead">
    <button class="back-btn" data-goto="home">‹ Back</button>
    <h2>All Questions</h2>
  </div>
  <div class="stage" style="justify-content:flex-start; text-align:left; gap:0;">
    <div class="accordion" id="accordion"></div>
  </div>
</section>

<script>
(function(){

  // ---------- data ----------
  var CATEGORIES = [
    {
      key: 'values',
      name: 'Values & Life Trajectory',
      tagline: 'The Foundation',
      wheelLabel: 'Foundation',
      goal: 'Determine whether your core worldviews, non-negotiables, and long-term paths align.',
      color: 'var(--q-values)',
      questions: [
        'What does a balanced life look like to you in 5 years?',
        'How was conflict handled in your house growing up?',
        'Are you a saver, an investor, or an experience-spender?',
        'What role does faith or spirituality play in your life, if any?',
        'Where do you see yourself living in ten years — same city, different country?',
        'How important is having kids to you, and by when would you want to know?',
        'What is a career sacrifice you would never make for a relationship?',
        'How do you define success for yourself?',
        'What did your parents get right, and what would you do differently?',
        'How much does your work identity define who you are?',
        'What is a value you will not compromise on for anyone?',
        'If money were not a factor, how would you spend your time?'
      ]
    },
    {
      key: 'mirror',
      name: 'Emotional Intelligence & Self-Awareness',
      tagline: 'The Mirror',
      wheelLabel: 'Mirror',
      goal: 'Gauge how they process feelings, handle mistakes, and view their past.',
      color: 'var(--q-mirror)',
      questions: [
        'What is a mistake you have made in a past relationship that taught you something important?',
        'How do you usually express stress or overwhelm, and what do you need from a partner when you feel that way?',
        'What is something you are actively working on improving about yourself?',
        'When was the last time you cried, and what brought it on?',
        'What is a pattern from your past relationships you are trying to break?',
        'How do you know when you are wrong, and how easily can you admit it?',
        'What is something people misunderstand about you at first?',
        'How do you handle being told something you do not want to hear?',
        'What is a fear you have had to work through recently?',
        'Who do you go to when you need to process something hard, and why them?',
        'What does self-care actually look like for you, beyond the buzzword?',
        'How has reflection or therapy shaped how you show up in relationships?'
      ]
    },
    {
      key: 'connect',
      name: 'Love Languages & Daily Intimacy',
      tagline: 'The Connection',
      wheelLabel: 'Connection',
      goal: 'Understand how they feel loved, give love, and navigate day-to-day closeness.',
      color: 'var(--q-connect)',
      questions: [
        'When do you feel most appreciated or cared for by someone you are dating?',
        'What does your ideal downtime look like after a hard week?',
        'How much alone time do you typically need to recharge?',
        'What is a small gesture that makes you feel loved?',
        'Do you prefer to be physically affectionate in public, or keep it private?',
        'How do you like to be comforted when you are having a rough day?',
        'What does quality time look like to you on an ordinary Tuesday?',
        'How do you feel about surprises — plan everything, or love the unexpected?',
        'What is something a partner did for you that you still think about?',
        'How important is physical touch to you day-to-day, outside the bedroom?',
        'What makes you feel unseen in a relationship?',
        'Do you show love more through words, actions, or gifts?'
      ]
    },
    {
      key: 'storm',
      name: 'Conflict & Communication Style',
      tagline: 'The Storm Prep',
      wheelLabel: 'Storm Prep',
      goal: 'Learn how they handle disagreements, criticism, and boundary-setting.',
      color: 'var(--q-storm)',
      questions: [
        'When you get upset with someone, do you need space right away, or do you prefer to talk it out immediately?',
        'What is a major dealbreaker for you in communication?',
        'How do you feel about raised voices during an argument?',
        'What is the difference between a disagreement and a dealbreaker for you?',
        'How do you bring up something that has been bothering you?',
        'What is your instinct when you feel criticized — defend, shut down, or ask questions?',
        'How do you rebuild trust after it has been broken?',
        'Do you keep score in relationships, or let things go once they are resolved?',
        'What does an apology need to include for you to actually accept it?',
        'How do you set a boundary without feeling guilty?',
        'What is a conversation you have been avoiding having with someone?',
        'How soon after a fight do you expect to reconnect?'
      ]
    }
  ];
  // wheel order: 0 top, 1 right, 2 bottom, 3 left — matches the wedge-label divs in HTML
  var WHEEL_ORDER = [0, 1, 3, 2]; // values(top), mirror(right), storm(bottom), connect(left)

  // ---------- nav ----------
  document.querySelectorAll('[data-goto]').forEach(function(btn){
    btn.addEventListener('click', function(){
      showScreen(btn.getAttribute('data-goto'));
    });
  });
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  // ---------- dahlia mark (home logo) ----------
  (function drawMark(){
    var g = document.getElementById('petals-home');
    var petalColors = ['var(--petal-outer)', 'var(--petal-mid)', 'var(--petal-inner)', 'var(--petal-mid)'];
    for (var i = 0; i < 8; i++){
      var angle = i * 45;
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      p.setAttribute('cx', 50);
      p.setAttribute('cy', 26);
      p.setAttribute('rx', 8);
      p.setAttribute('ry', 20);
      p.setAttribute('fill', petalColors[i % petalColors.length]);
      p.setAttribute('opacity', '0.9');
      p.setAttribute('transform', 'rotate(' + angle + ' 50 50)');
      g.appendChild(p);
    }
  })();

  // ---------- wheel labels ----------
  var labelEls = document.querySelectorAll('.wedge-label');
  labelEls.forEach(function(el){
    var i = parseInt(el.getAttribute('data-idx'), 10);
    var catIdx = WHEEL_ORDER[i];
    el.textContent = CATEGORIES[catIdx].wheelLabel;
  });

  // ---------- spin mechanics ----------
  var bottle = document.getElementById('bottlePin');
  var spinBtn = document.getElementById('spinBtn');
  var prompt = document.getElementById('gamePrompt');
  var resultSlot = document.getElementById('resultSlot');
  var currentRotation = 0;
  var lastQuestionByCategory = {};
  var spinning = false;

  spinBtn.addEventListener('click', spin);
  bottle.addEventListener('click', function(){ if (!spinning) spin(); });

  function spin(){
    if (spinning) return;
    spinning = true;
    bottle.classList.add('spinning');
    spinBtn.disabled = true;
    spinBtn.textContent = 'Spinning…';
    prompt.textContent = '…';
    labelEls.forEach(function(el){ el.classList.remove('lit'); });

    var wheelSlot = Math.floor(Math.random() * 4); // 0 top,1 right,2 bottom,3 left
    var categoryIdx = WHEEL_ORDER[wheelSlot];
    var jitter = (Math.random() * 40) - 20; // stay well inside the 90deg wedge
    var targetAngle = wheelSlot * 90 + jitter;
    var extraSpins = 4 + Math.floor(Math.random() * 3);
    var baseline = Math.ceil((currentRotation + 1) / 360) * 360;
    var finalRotation = baseline + extraSpins * 360 + targetAngle;
    currentRotation = finalRotation;

    bottle.style.transition = 'transform 3.1s cubic-bezier(0.14,0.82,0.24,1)';
    bottle.style.transform = 'translate(-50%,-50%) rotate(' + finalRotation + 'deg)';

    setTimeout(function(){
      spinning = false;
      bottle.classList.remove('spinning');
      spinBtn.disabled = false;
      spinBtn.textContent = 'Spin Again';
      revealCategory(categoryIdx, wheelSlot);
    }, 3150);
  }

  function revealCategory(categoryIdx, wheelSlot){
    var cat = CATEGORIES[categoryIdx];
    labelEls[wheelSlot].classList.add('lit');

    var pool = cat.questions;
    var idx;
    if (pool.length > 1 && lastQuestionByCategory[categoryIdx] !== undefined){
      do { idx = Math.floor(Math.random() * pool.length); }
      while (idx === lastQuestionByCategory[categoryIdx]);
    } else {
      idx = Math.floor(Math.random() * pool.length);
    }
    lastQuestionByCategory[categoryIdx] = idx;

    prompt.textContent = 'The bottle points to ' + cat.tagline + '.';
    resultSlot.innerHTML =
      '<div class="result-card flip-anim">' +
        '<div class="result-tag">' + cat.name + '</div>' +
        '<div class="result-question">' + pool[idx] + '</div>' +
      '</div>';
  }

  // ---------- browse accordion ----------
  (function buildAccordion(){
    var wrap = document.getElementById('accordion');
    CATEGORIES.forEach(function(cat){
      var item = document.createElement('div');
      item.className = 'acc-item';

      var head = document.createElement('button');
      head.className = 'acc-head';
      head.innerHTML =
        '<span class="t">' +
          '<span class="name"><span class="swatch" style="background:' + cat.color + '"></span> ' + cat.name + '</span>' +
          '<span class="goal">' + cat.goal + '</span>' +
        '</span>' +
        '<span class="acc-chevron">›</span>';
      head.querySelector('.name').style.display = 'inline-flex';
      head.querySelector('.name').style.alignItems = 'center';
      head.querySelector('.name').style.gap = '8px';

      var body = document.createElement('div');
      body.className = 'acc-body';
      var ul = document.createElement('ul');
      ul.className = 'acc-list';
      cat.questions.forEach(function(q){
        var li = document.createElement('li');
        li.textContent = q;
        ul.appendChild(li);
      });
      body.appendChild(ul);

      head.addEventListener('click', function(){
        item.classList.toggle('open');
      });

      item.appendChild(head);
      item.appendChild(body);
      wrap.appendChild(item);
    });
  })();

})();
</script>
</body>
</html>

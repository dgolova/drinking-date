<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dahlia's Destiny</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dahlia's Destiny">
<meta name="theme-color" content="#08050a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --black: #08050a;
    --wine-deep: #1a0e14;
    --burgundy: #3b0d14;
    --wine: #6e0f1f;
    --wine-bright: #9c2c3a;
    --gold: #b6ada0;
    --gold-bright: #f2ece2;
    /* controls: a dahlia red, light enough to carry near-black lettering */
    --red: #c0303f;
    --red-bright: #e75a63;
    --red-hairline: rgba(231,90,99,0.42);
    --parchment: #e8ddd0;
    --muted: #93837c;
    --hairline: rgba(220,212,201,0.26);
    /* dahlia, outside in — light petals at the rim, deepening to a gold heart */
    --petal-outer: #f0e2ce;
    --petal-mid: #c05468;
    --petal-inner: #7d1226;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{
    height:100%;
    /* A solid colour, not just the gradient. Safari tints the status bar and
       home-indicator strips from background-color, and the old rule left it
       transparent (a gradient is a background-image), which showed as white.
       This colour propagates to the canvas, so it covers overscroll too. */
    background-color: var(--black);
    background-image: radial-gradient(120% 90% at 50% 0%, var(--wine-deep) 0%, var(--black) 62%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-size: clamp(17px, 4.9vw, 20px);
  }
  html,body{
    margin:0; padding:0;
    color: var(--parchment);
    font-family: 'EB Garamond', serif;
    overscroll-behavior:none;
  }
  body{
    /* transparent on purpose: a background here would paint over the glow below */
    background: transparent;
    min-height:100%;
    min-height:100dvh;
    display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Backstop for the Safari versions that treat background-attachment:fixed as
     scroll: a fixed layer that covers the viewport exactly, whatever the page
     height or the safe-area insets are doing. */
  body::before{
    content:'';
    position: fixed;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, var(--wine-deep) 0%, var(--black) 62%);
    z-index: -1;
    pointer-events: none;
  }
  h1,h2,h3,.display{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .screen{
    display:none;
    flex:1;
    flex-direction:column;
    padding: 28px 22px 36px;
    max-width: 520px;
    margin: 0 auto;
    width:100%;
    animation: rise 0.35s ease;
  }
  .screen.active{ display:flex; }
  @media (max-width: 400px){
    .screen{ padding: 24px 16px 32px; }
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Home ---------- */
  #home .home-top{
    text-align:center;
    padding-top: 18px;
    margin-bottom: 34px;
  }
  .dahlia-mark{
    width:84px; height:84px;
    margin: 0 auto 14px;
    display:block;
  }
  .app-title{ font-size: 2.3rem; color: var(--parchment); }
  .app-sub{
    font-style: italic;
    color: var(--muted);
    font-size: 1.05rem;
    margin-top: 6px;
  }
  .menu{
    border-top: 1px solid var(--hairline);
  }
  .menu-item{
    width:100%;
    background:none; border:none;
    border-bottom: 1px solid var(--hairline);
    color: var(--parchment);
    font-family:'Cormorant Garamond', serif;
    text-align:left;
    padding: 20px 4px;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }
  .menu-item .label{ display:flex; flex-direction:column; gap:3px; }
  .menu-item .name{ font-size: 1.45rem; }
  .menu-item .hint{ font-family:'EB Garamond', serif; font-style:italic; font-size:0.95rem; color: var(--muted); }
  .menu-item .chevron{ color: var(--red-bright); font-size:1.4rem; opacity:0.85; }
  .menu-item:active{ background: rgba(231,90,99,0.07); }
  .footer-note{
    text-align:center;
    color: var(--muted);
    font-style: italic;
    font-size: 0.95rem;
    margin-top: 30px;
  }

  /* ---------- Shared sub-view header ---------- */
  .subhead{
    display:flex; align-items:center; gap:14px;
    margin-bottom: 26px;
  }
  .back-btn{
    background:none; border: 1px solid var(--red-hairline);
    color: var(--red-bright);
    font-family:'Cormorant Garamond', serif;
    font-size: 1.05rem;
    padding: 7px 15px;
    border-radius: 999px;
    cursor:pointer;
  }
  .back-btn:active{ background: rgba(231,90,99,0.12); }
  .subhead h2{ font-size: 1.6rem; }

  .stage{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center;
    /* `safe` stops a tall reading from centring itself off the top edge */
    justify-content:center;
    justify-content: safe center;
    gap: 30px;
    text-align:center;
    perspective: 900px;
    /* The stage absorbs whatever the draw produces — a card, a number, a
       three-card spread — by scrolling inside itself. It never grows the
       screen, so the buttons below it cannot be pushed about. */
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* Whatever is on the stage keeps its full height — the stage scrolls
     rather than squeezing a reading to fit. */
  .stage > *{ flex-shrink: 0; }
  /* The draw buttons sit in their own band at the foot of the screen and
     stay there, whatever lands on the stage above them. */
  .actions{
    flex: 0 0 auto;
    display:flex; gap: 12px; flex-wrap:wrap; justify-content:center;
    padding-top: 24px;
  }
  .prompt{ color: var(--muted); font-style: italic; font-size: 1.12rem; max-width: 340px; }

  @keyframes flipReveal{
    0%{ transform: rotateY(90deg) scale(0.92); opacity: 0.15; }
    55%{ transform: rotateY(0deg) scale(1.03); opacity: 1; }
    100%{ transform: rotateY(0deg) scale(1); opacity: 1; }
  }
  .flip-anim{
    animation: flipReveal 0.5s cubic-bezier(.25,.8,.35,1);
    animation-fill-mode: backwards;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  .result-slot{
    min-height: 90px;
    width: 100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 14px;
  }
  .card-icon{ width:66px; height:66px; display:block; margin: 0 auto; }

  .action-btn{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
    color: var(--black);
    background: linear-gradient(180deg, var(--red-bright), var(--red));
    border: none;
    padding: 15px 34px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 6px 20px rgba(192,48,63,0.22);
  }
  .action-btn:active{ transform: translateY(1px); box-shadow: 0 3px 10px rgba(192,48,63,0.2); }
  .action-btn.secondary{
    background:none;
    color: var(--red-bright);
    border: 1px solid var(--red-hairline);
    box-shadow:none;
  }

  </style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen active">

</section>

})();
</script>
</body>
</html>
